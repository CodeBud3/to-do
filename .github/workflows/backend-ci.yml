name: Backend

on:
  push:
    branches: ["prestaging"]
  pull_request:
    branches: ["prestaging"]
    paths:
      - "backend/**" # Runs only if files in backend/ change

jobs:
  test-backend:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: |
          cd backend
          npm install

      - name: Create .env.unit-test file
        run: |
          cd backend
          touch .env.unit-test
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.unit-test
          echo "GMAIL_CLIENT_ID=${{ secrets.GMAIL_CLIENT_ID }}" >> .env.unit-test
          echo "GMAIL_CLIENT_SECRET=${{ secrets.GMAIL_CLIENT_SECRET }}" >> .env.unit-test
          echo "GMAIL_REFRESH_TOKEN=${{ secrets.GMAIL_REFRESH_TOKEN }}" >> .env.unit-test
          echo "GOOGLE_OAUTH2_CLIENT_ID=${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}" >> .env.unit-test
          echo "GOOGLE_OAUTH2_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}" >> .env.unit-test
          echo "MONDO_DB_CONNECT=${{ secrets.MONDO_DB_CONNECT }}" >> .env.unit-test
          echo "MS_OAUTH2_CLIENT_ID=${{ secrets.MS_OAUTH2_CLIENT_ID }}" >> .env.unit-test
          echo "MS_OAUTH2_CLIENT_SECRET=${{ secrets.MS_OAUTH2_CLIENT_SECRET }}" >> .env.unit-test
          echo "MS_OAUTH2_TENANT_ID=${{ secrets.MS_OAUTH2_TENANT_ID }}" >> .env.unit-test
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env.unit-test
          echo "PORT=5000" >> .env.unit-test
          echo "NODE_ENV=unit-test" >> .env.unit-test
          echo "SESSION_KEY=session-token" >> .env.unit-test
          echo "CLIENT_URL=http://localhost:5173" >> .env.unit-test
          echo "HOST_URL=http://localhost:5000" >> .env.unit-test
          echo "GOOGLE_OAUTH2_REDIRECT_URI=/api/auth/google/callback" >> .env.unit-test
          echo "MS_OAUTH2_REDIRECT_URL=/api/auth/microsoft/callback" >> .env.unit-test
          echo "GMAIL_REDIRECT_URI = https://developers.google.com/oauthplayground" >> .env.unit-test
          echo "EMAIL_USER=codebuddev@gmail.com" >> .env.unit-test

      - name: Run Jest Tests
        run: |
          cd backend
          npm run test
  build-backend:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build Docker image
        run: |
          RAW_BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "Sanitized Branch: $SAFE_BRANCH"
          cd backend
          docker build -t rakesh013595/to-do:$SAFE_BRANCH .
          docker push rakesh013595/to-do:$SAFE_BRANCH

name: Frontend CI

on:
  push:
    branches: ["prestaging"]
  pull_request:
    branches: ["prestaging"]
    paths:
      - "frontend/**" # Runs only if files in frontend/ change

jobs:
  test-frontend:
    name: Run Unit Tests Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Vitest Tests
        run: |
          cd frontend
          npx vitest --run --passWithNoTests
  build-frontend:
    name: Build Frontend Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build the Project
        run: |
          cd frontend
          npm run build
